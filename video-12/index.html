<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Boxmodel</title>

    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            /* border: 2px solid black; */
            background-color: aqua;
        }
        .box1{
            color: red;
            padding: 10px;
            border: 2px solid black;
            margin: 25px;
            height: 200px;
            box-sizing: border-box;
        }
        .box2{
            color: green;
            color: red;
            padding: 10px;
            border: 2px solid black;
            margin: 25px;
            height: 200px;
            box-sizing: border-box;
        }
        
    </style>

</head>
<body>
    <div class="box box1 ">box model 1 </div>
    <div class="box box2 ">box model 2 </div>
</body>
</html>
