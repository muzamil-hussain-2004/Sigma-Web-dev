<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text shadow</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            padding: 20px;
              background: #f9f9f9;
        }
        .heading{
            font-size: 40px;
            color: #333;
            text-shadow: 2px 2px 4px  #888888;
                  margin-bottom: 20px;
        }
        .glow{
            font-size: 40px;
            color: white;
            background: black;
            display: inline-block;
            padding: 10px;
            text-shadow: 0 0 10px #00f, 0 0 20px #00f, 0 0 30px #00f;
        }
        .text-shadow{
            font-size: 20px;
            color: #555;
            text-shadow: 1px 1px 2px #aaa;
        }
        
    </style>
</head>

<body>


    <h2>Text Shadow Example</h2>

    <div class="heading">Elegant Text Shadow</div>
    <br>
    <div class="glow">Glowing Text Effect</div>
    <p class="text-shadow">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Nullam auctor, nisl eget ultricies tincidunt, nunc nisl aliquam nisl, eget ultricies nunc nisl eget nunc.</p>
    <div class="box">
        box 1 
    </div>

</body>

</html>
