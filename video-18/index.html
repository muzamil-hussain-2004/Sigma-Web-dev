<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows in css</title>
    <style>
     body{
           font-family: Arial, sans-serif;
      padding: 20px;
      background: #f9f9f9;
     }

        .card {
            width: 220px;
            height: 120px;
            background: white;
            box-shadow: 5px 5px 15px 5px #888888;
             padding: 20px;
      margin-bottom: 20px;
      border: 2px solid rgb(26, 255, 0);
      outline: 3px dashed black;
      outline-offset: 5px;
        }
        .input-box{
            width: 250px;
            padding: 10px;
            border: 1px solid #ccc;
            box-shadow: inset 2px 2px 6px  rgba(0,0,0,0.3);
        }
        h2{
            font-size: 40px;
            color: #333;
            text-shadow: 2px 2px 4px #888888;
        }
        .button:focus{
            outline: 2px solid red;
        }

    </style>
</head>

<body>
    <h2>box shadow example</h2>
    <div class="card">
        This is a box with outer shadow
    </div>
    <input type="text" placeholder="Inset shadow input" class="input-box">
    <button class="button">Submit</button>
</body>

</html>
