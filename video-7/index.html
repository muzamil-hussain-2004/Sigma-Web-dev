<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline and - Block Elements - HTML </title>
    <link rel="stylesheet" href="style.css"
</head>
<body>
    <p>hi im am para</p>
    <a href="https://google.com">google</a>
    <div>I am a block element</div>


<span>i am a inline element</span>
<a href="">yes he is inline </a>

<form action="/submit">
    <div> 
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Enter Your Name">
    </div>
    <div>
        <label for="city"> Select your city </label>
        <select name="city" id="city">
            <option value="karachi">Karachi</option>
            <option value="lahore">lahore</option>
            <option value="badin">badin</option>
            <option value="hyderabad">Hyderabad</option>
        </select>
    </div>
    <div>
        <label for="pincode">Enter your pincode</label>
        <input type="number" placeholder="Enter Your Pincode" id="pincode">
    </div>
</form>

</body>
</html>
