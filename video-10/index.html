<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic HTML Tags</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <ul id="nav-item">
                <li>Home</li>
                <li>About</li>
                <li>Contact</li>
            </ul>
        </nav>
    </header>
    <hr>
    <main>
        <div class="main-container">
            <section id="video-section">
                <div class="video-container">
                    <div class="video-content">
                         <h1>Video Content</h1>
                        <ul class="videos">
                            <li> <video width="620" height="440" controls preload="metadata">
                            <source src="../video-1.mp4" type="video/mp4"> </video></li>
                            <li> <video width="620" height="440" controls preload="metadata">
                            <source src="../video-2.mp4" type="video/mp4"></video></li>
                            <li> <video width="620" height="440" controls preload="metadata">
                            <source src="../video.mp4" type="video/mp4"></video></li>
                            <li> <video width="620" height="440" controls preload="metadata">
                            <source src="../video-4.mp4" type="video/mp4"></video></li>
                            <li> <video width="620" height="440" controls preload="metadata">
                            <source src="../video-5.mp4" type="video/mp4"></video></li>
                            <li> <video width="620" height="440" controls preload="metadata">
                            <source src="../video-6.mp4" type="video/mp4"></video></li>
                        </ul>
                    </div>
                </section>
                    <section id="audio-section">
                    <div class="audio-container">
                    <div class="audio-content">
                         <h1>Audio Content</h1>
                        <ul class="audios">
                            <li><audio src="../music-3.mp3" controls></audio></li>
                            <li><audio src="../music-4.mp3" controls></audio></li>
                            <li><audio src="../music-5.mp3" controls></audio></li>
                            <li><audio src="../music-6.mp3" controls></audio></li>
                            <li><audio src="../music-3.mp3" controls></audio></li>
                            <li><audio src="../music-4.mp3" controls></audio></li>
                        </ul>
                    </div>
                </div>
                    </section>

        </div>
    </main>

    <footer>
        <p><strong>&copy; 2023 My Website. All rights reserved.</strong></p>
    </footer>

</body>
</html>
