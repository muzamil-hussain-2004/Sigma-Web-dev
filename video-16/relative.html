<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Relative Units</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            font-size: 16px;
        }
        .parent{
             border: 2px solid black;
        }
        .em  { font-size: 2em; background-color: lightblue}
        .rem { font-size: 2rem; background-color: lightgreen}
        .percent {width: 80%; height: 50px; background-color:coral}
        .vh { height: 20vh; background-color: gold}
        .vw { width: 50vw; background-color: violet; height: 50px;}
    </style>
</head>
<body>

    <h2>CSS Relative Units</h2>
    <div class="parent">
        <p class="em"> This is 2em (relative to parent font-size) </p>
        <p class="rem"> This is 2rem (realtive to root font-size) </p>
        <div class="percent"> This box is 80% of parent width </div>
        <div class="vh"> This is 20% of viewport height </div>
        <div class="vw"> This box is 50% of viewport width </div>
    </div>
</body>
</html>
